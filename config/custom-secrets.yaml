rules:
  # ============================================================
  # Custom Secret Detection Rules
  # ============================================================
  # Two categories:
  #   1. Config files (.properties, .env, .conf) — uses 'generic'
  #      language mode since Semgrep can't natively parse these.
  #   2. Source code (.py, .java) — uses native language patterns
  #      for hardcoded credential assignments.
  #
  # Complements p/secrets which only detects known vendor token
  # formats (AWS keys, GitHub PATs, etc.) and cannot parse
  # .properties files or detect generic hardcoded passwords.
  # ============================================================

  # ----------------------------------------------------------
  # Source Code Rules (native language parsing)
  # ----------------------------------------------------------

  - id: hardcoded-secret-python
    patterns:
      - pattern: $VAR = "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i).*(PASSWORD|PASSWD|PWD|SECRET|CREDENTIAL|API_KEY|AUTH_TOKEN|ACCESS_TOKEN).*"
      - metavariable-regex:
          metavariable: $VALUE
          regex: ".{4,}"
      - metavariable-regex:
          metavariable: $VALUE
          regex: "(?i)(?!.*(PASSWORD|PASSWD|PWD|SECRET|CREDENTIAL|API_KEY|AUTH_TOKEN|ACCESS_TOKEN|\\.(txt|json|yaml|yml|xml|conf|cfg|properties)$)).*"
    languages:
      - python
    severity: ERROR
    message: >-
      Hardcoded credential assigned to variable '$VAR' in Python source code.
      Credentials should never be committed to source control.
      Use environment variables, a secrets vault (e.g. HashiCorp Vault,
      AWS Secrets Manager), or encrypted configuration instead.
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      technology:
        - python
      confidence: HIGH
      impact: HIGH

  - id: hardcoded-secret-java
    patterns:
      - pattern: $TYPE $VAR = "$VALUE";
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i).*(PASSWORD|PASSWD|PWD|SECRET|CREDENTIAL|API_KEY|AUTH_TOKEN|ACCESS_TOKEN).*"
      - metavariable-regex:
          metavariable: $VALUE
          regex: ".{4,}"
      - metavariable-regex:
          metavariable: $VALUE
          regex: "(?i)(?!.*(PASSWORD|PASSWD|PWD|SECRET|CREDENTIAL|API_KEY|AUTH_TOKEN|ACCESS_TOKEN|\\.(txt|json|yaml|yml|xml|conf|cfg|properties)$)).*"
    languages:
      - java
    severity: ERROR
    message: >-
      Hardcoded credential assigned to variable '$VAR' in Java source code.
      Credentials should never be committed to source control.
      Use environment variables, a secrets vault (e.g. HashiCorp Vault,
      AWS Secrets Manager), or encrypted configuration instead.
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      technology:
        - java
      confidence: HIGH
      impact: HIGH

  # ----------------------------------------------------------
  # Config File Rules (generic language mode)
  # ----------------------------------------------------------

  - id: hardcoded-password-properties
    patterns:
      - pattern-regex: "(?i)(?<!#\\s)(?<!#)(password|passwd|pwd|secret|credential)\\s*[=:]\\s*(?!\\{\\{)(?!\\$\\{)(?![}\\)])\\S+"
    paths:
      include:
        - "*.properties"
        - "*.env"
        - "*.conf"
        - "*.cfg"
        - "*.ini"
        - "*.yaml"
        - "*.yml"
      exclude:
        - "chart/templates/*"
        - "charts/*/templates/*"
        - "helm/*/templates/*"
    languages:
      - generic
    severity: ERROR
    message: >-
      Hardcoded password detected in configuration file.
      Credentials should never be committed to source control.
      Use environment variables, a secrets vault (e.g. HashiCorp Vault,
      AWS Secrets Manager), or encrypted configuration instead.
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      technology:
        - java
        - generic
      confidence: HIGH
      impact: HIGH

  - id: hardcoded-jdbc-connection-string
    patterns:
      - pattern-regex: "jdbc\\.(url|connection)\\s*[=:]\\s*jdbc:[a-z]+://[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+"
    paths:
      include:
        - "*.properties"
        - "*.env"
        - "*.conf"
        - "*.cfg"
        - "*.ini"
        - "*.yaml"
        - "*.yml"
      exclude:
        - "chart/templates/*"
        - "charts/*/templates/*"
        - "helm/*/templates/*"
    languages:
      - generic
    severity: WARNING
    message: >-
      Hardcoded JDBC connection string with internal IP address detected.
      Database connection details should be externalised via environment
      variables or a configuration management system, not committed to
      source control.
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      technology:
        - java
        - generic
      confidence: MEDIUM
      impact: MEDIUM

  - id: hardcoded-redis-password
    patterns:
      - pattern-regex: "(?i)(?<!#\\s)(?<!#)redis[._-]?(sentinel[._-]?)?(password|auth|secret)\\s*[=:]\\s*(?!\\{\\{)(?!\\$\\{)(?![}\\)])\\S+"
    paths:
      include:
        - "*.properties"
        - "*.env"
        - "*.conf"
        - "*.cfg"
        - "*.ini"
        - "*.yaml"
        - "*.yml"
      exclude:
        - "chart/templates/*"
        - "charts/*/templates/*"
        - "helm/*/templates/*"
    languages:
      - generic
    severity: ERROR
    message: >-
      Hardcoded Redis password detected in configuration file.
      Redis credentials should be managed via environment variables
      or a secrets vault, not committed to source control.
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      technology:
        - generic
      confidence: HIGH
      impact: HIGH

  - id: hardcoded-api-key-properties
    patterns:
      - pattern-regex: "(?i)(?<!#\\s)(?<!#)(api[._-]?key|api[._-]?secret|auth[._-]?token|access[._-]?token|bearer[._-]?token)\\s*[=:]\\s*(?!\\{\\{)(?!\\$\\{)(?![}\\)])\\S+"
    paths:
      include:
        - "*.properties"
        - "*.env"
        - "*.conf"
        - "*.cfg"
        - "*.ini"
        - "*.yaml"
        - "*.yml"
      exclude:
        - "chart/templates/*"
        - "charts/*/templates/*"
        - "helm/*/templates/*"
    languages:
      - generic
    severity: ERROR
    message: >-
      Hardcoded API key or token detected in configuration file.
      API keys and tokens should be managed via environment variables
      or a secrets vault, not committed to source control.
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      technology:
        - generic
      confidence: HIGH
      impact: HIGH
