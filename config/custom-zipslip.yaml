rules:
  # ============================================================
  # Custom Zip Slip Detection Rules (Taint Mode)
  # ============================================================
  # Detects CWE-22 (Path Traversal) via zip/tar archive extraction.
  # A zip entry name containing "../" can escape the target directory
  # and overwrite arbitrary files on the filesystem.
  #
  # Uses Semgrep OSS taint analysis (single-function scope).
  # Limitation: cannot track taint across function boundaries.
  # For cross-function taint analysis, Semgrep Pro is required.
  #
  # References:
  #   - https://snyk.io/research/zip-slip-vulnerability
  #   - https://cwe.mitre.org/data/definitions/22.html
  # ============================================================

  # ----------------------------------------------------------
  # Java: ZipEntry.getName() -> new File()
  # ----------------------------------------------------------
  - id: zipslip-java
    languages: [java]
    severity: ERROR
    message: >-
      Zip Slip vulnerability: archive entry name from `$ENTRY.getName()` is used
      to construct a file path without validating that it stays within the
      intended extraction directory. An attacker can craft a zip file with
      entries like `../../etc/cron.d/backdoor` to write files outside the
      target folder. Validate the canonical path of the destination file
      starts with the canonical path of the extraction directory.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2017 - Injection"
        - "A03:2021 - Injection"
      confidence: HIGH
      references:
        - https://snyk.io/research/zip-slip-vulnerability
        - https://cwe.mitre.org/data/definitions/22.html
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: (java.util.zip.ZipEntry $ENTRY).getName()
      - patterns:
          - pattern: (java.util.jar.JarEntry $ENTRY).getName()
    pattern-sinks:
      - patterns:
          - pattern: new java.io.FileOutputStream(...)
      - patterns:
          - pattern: new java.io.FileWriter(...)
      - patterns:
          - pattern: java.nio.file.Files.copy(...)
      - patterns:
          - pattern: java.nio.file.Files.write(...)
      - patterns:
          - pattern: java.nio.file.Files.newOutputStream(...)
      - patterns:
          - pattern: java.nio.file.Paths.get(...)
      - patterns:
          - pattern: java.nio.file.Path.of(...)
    pattern-sanitizers:
      - patterns:
          - pattern: $F.getCanonicalPath()
      - patterns:
          - pattern: $F.toPath().normalize()
      - patterns:
          - pattern: java.nio.file.Path.normalize(...)

  # ----------------------------------------------------------
  # Python: ZipInfo / TarInfo -> file path construction
  # ----------------------------------------------------------
  - id: zipslip-python
    languages: [python]
    severity: ERROR
    message: >-
      Zip Slip vulnerability: archive entry name is used to construct a file
      path without validating that it stays within the intended extraction
      directory. An attacker can craft an archive with entries like
      `../../etc/cron.d/backdoor` to write files outside the target folder.
      Use `os.path.realpath()` to resolve the destination and verify it starts
      with the intended extraction directory.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2017 - Injection"
        - "A03:2021 - Injection"
      confidence: HIGH
      references:
        - https://snyk.io/research/zip-slip-vulnerability
        - https://cwe.mitre.org/data/definitions/22.html
    mode: taint
    pattern-sources:
      - pattern: $ENTRY.filename
      - pattern: $ENTRY.name
    pattern-sinks:
      - pattern: open(...)
      - pattern: pathlib.Path(...)
    pattern-sanitizers:
      - pattern: os.path.realpath(...)
      - pattern: os.path.abspath(...)
      - pattern: $P.resolve()
