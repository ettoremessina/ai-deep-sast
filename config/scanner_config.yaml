# AI Deep SAST Configuration
# ========================================
# Uses Foundation-Sec-8B-Instruct Q8_0 GGUF via llama-completion
# https://huggingface.co/fdtn-ai/Foundation-Sec-8B-Instruct-Q8_0-GGUF
#
# This is the INSTRUCT variant — fine-tuned for following structured
# instructions, which produces better formatted security analysis
# compared to the base model.
#
# Optimised for Apple Silicon Mac with 18 GB unified memory
# Memory footprint: ~8-9 GB (Q8_0 quantisation)

# Target file or directory to scan
target: "."

# Foundation-Sec-8B-Instruct GGUF model
hf_repo: "fdtn-ai/Foundation-Sec-8B-Instruct-Q8_0-GGUF"
hf_file: "foundation-sec-8b-instruct-q8_0.gguf"

# Model inference settings (optimised for 18 GB Mac)
ctx_size: 8192 # Increased from 2048 for better context handling, decrease it if you have memory issues (depending on your laptop)
n_gpu_layers: -1
threads: 6

# Generation settings
max_tokens: 1024
temperature: 0.1

# Output directory for reports
output_dir: "security-reports"

# Minimum severity to fail the build: INFO, WARNING, ERROR
severity_threshold: "WARNING"

# Timeout for each LLM call (seconds)
llm_timeout: 600

# Semgrep rulesets (comma-separated for multiple)
# - p/default: Semgrep's broad recommended ruleset (~600+ rules)
#   Includes OWASP Top 10, CWE Top 25, language-specific, and audit rules
# - p/secrets: Known vendor secret patterns (AWS, GitHub, etc.)
# - config/custom-secrets.yaml: Hardcoded passwords in .properties/.env/.conf files
# - config/custom-zipslip.yaml: Zip Slip path traversal (CWE-22) for Java and Python
semgrep_config: "p/default,p/secrets,config/custom-secrets.yaml,config/custom-zipslip.yaml"

# Semgrep scan timeout (seconds)
semgrep_timeout: 300

# Logging
log_level: "INFO"
log_file: "security-reports/scanner.log"

# Set to true to run without LLM analysis
skip_llm: false

# Rule ID prefixes to skip LLM analysis for (comma-separated).
# Findings from these rules use Semgrep metadata instead of LLM,
# which avoids redundant LLM calls for deterministic rules
# (e.g. custom secret detection where CWE/OWASP are already known).
skip_llm_rules: "config."